version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]  # ← Fixed typo: pg_ready → pg_isready
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: backend
    depends_on:
      - db
      - redis

    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      SECRET_KEY: 1B8D81175B49C25B9176A8FD32FED
      API_VERSION: /api/v1
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    command: bash -c 'fastapi dev core/main.py --host 0.0.0.0 --port 8000'
    volumes:
      - ./core:/usr/src/app/core   # ← FIXED: Mount to correct path